<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ホテル共有">
<meta name="theme-color" content="#f2f2f7">
<title>家族ホテル共有帳</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="nav-bar" id="nav-bar">
    <div class="nav-bar-row">
      <h1 class="large-title">ホテル一覧</h1>
      <button type="button" id="open-add" class="round-btn" aria-label="ホテルを追加">
        <span>＋</span>
      </button>
    </div>
    <div class="chip-scroll" id="chip-scroll"></div>
  </header>

  <main class="content" id="hotel-list">
    <div class="empty-state">
      <div class="empty-icon">🏨</div>
      <p class="empty-title">まだ登録がありません</p>
      <p class="empty-sub">右上の ＋ から、気になったホテルを追加しましょう</p>
    </div>
  </main>

</div>

<!-- 追加シート -->
<div class="sheet-overlay" id="add-overlay"></div>
<div class="sheet" id="add-sheet" role="dialog" aria-modal="true">
  <div class="sheet-grabber"></div>
  <div class="sheet-header">
    <button type="button" class="sheet-btn" id="add-cancel">キャンセル</button>
    <h2 class="sheet-title">ホテルを追加</h2>
    <button type="submit" form="hotel-form" class="sheet-btn sheet-btn-primary" id="add-submit">追加</button>
  </div>

  <form id="hotel-form" class="ios-form">
    <div class="form-group">
      <div class="form-row">
        <label for="name">ホテル名</label>
        <input type="text" id="name" placeholder="〇〇温泉 △△の宿" required autocomplete="off">
      </div>
      <div class="form-row">
        <label for="prefecture">都道府県</label>
        <select id="prefecture" required>
          <option value="">選択してください</option>
        </select>
      </div>
      <div class="form-row">
        <label for="source">見つけた場所</label>
        <select id="source">
          <option value="𝕏 (Twitter)">𝕏 (Twitter)</option>
          <option value="Instagram">Instagram</option>
          <option value="Googleマップ">Googleマップ</option>
          <option value="楽天トラベル">楽天トラベル</option>
          <option value="WEBサイト">WEBサイト</option>
          <option value="その他">その他</option>
        </select>
      </div>
      <div class="form-row">
        <label for="url">リンクURL</label>
        <input type="url" id="url" placeholder="https://..." autocomplete="off">
      </div>
    </div>

    <div class="form-group">
      <div class="form-row form-row-stacked">
        <label for="memo">メモ</label>
        <textarea id="memo" rows="3" placeholder="気になったポイントなど"></textarea>
      </div>
    </div>

    <div class="form-group">
      <div class="form-row">
        <label for="addedBy">あなたの名前</label>
        <input type="text" id="addedBy" placeholder="お母さん" autocomplete="off">
      </div>
    </div>

    <p id="form-error" class="form-error"></p>
  </form>
</div>

<!-- 削除アクションシート -->
<div class="action-sheet-overlay" id="delete-overlay"></div>
<div class="action-sheet" id="delete-sheet" role="dialog" aria-modal="true">
  <div class="action-sheet-group">
    <div class="action-sheet-title" id="delete-target-name"></div>
    <button type="button" class="action-sheet-btn destructive" id="confirm-delete">削除</button>
  </div>
  <button type="button" class="action-sheet-btn cancel" id="cancel-delete">キャンセル</button>
</div>

<script src="app.js"></script>
</body>
</html>
